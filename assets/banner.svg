<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">José Genaro Rivera Fernández</title>
  <desc id="d">Backend .NET Senior y Full Stack. C#, .NET, SQL Server, Angular, Docker, CI/CD.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="0.55" stop-color="#14245f"/>
      <stop offset="1" stop-color="#2f5bea"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7c9bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c9bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="260" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#dots)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>

    <!-- Texto -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="64" y="104" fill="#ffffff" font-size="48" font-weight="700">José Genaro</text>
      <text x="64" y="156" fill="#ffffff" font-size="48" font-weight="700">Rivera Fernández</text>
      <text x="64" y="196" fill="#b9c8ff" font-size="22" font-weight="500">Backend .NET Senior  ·  Full Stack</text>

      <!-- Etiquetas -->
      <g font-size="14" font-weight="600" fill="#e8eeff" text-anchor="middle">
        <rect x="64" y="212" width="46" height="28" rx="14" fill="#ffffff" fill-opacity="0.14"/>
        <text x="87" y="231">C#</text>
        <rect x="120" y="212" width="62" height="28" rx="14" fill="#ffffff" fill-opacity="0.14"/>
        <text x="151" y="231">.NET</text>
        <rect x="192" y="212" width="104" height="28" rx="14" fill="#ffffff" fill-opacity="0.14"/>
        <text x="244" y="231">SQL Server</text>
        <rect x="306" y="212" width="82" height="28" rx="14" fill="#ffffff" fill-opacity="0.14"/>
        <text x="347" y="231">Angular</text>
        <rect x="398" y="212" width="76" height="28" rx="14" fill="#ffffff" fill-opacity="0.14"/>
        <text x="436" y="231">Docker</text>
        <rect x="484" y="212" width="72" height="28" rx="14" fill="#ffffff" fill-opacity="0.14"/>
        <text x="520" y="231">CI/CD</text>
      </g>
    </g>

    <!-- Terminal decorativa: idempotencia en acción -->
    <g transform="translate(748 34)">
      <rect width="392" height="192" rx="12" fill="#070c1d" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.16"/>
      <circle cx="20" cy="20" r="5.5" fill="#ff6159"/>
      <circle cx="40" cy="20" r="5.5" fill="#ffbd2e"/>
      <circle cx="60" cy="20" r="5.5" fill="#28c941"/>
      <g font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="14">
        <text x="20" y="62" fill="#8fa2d6">POST /giftcards/GC-7K3M/redeem</text>
        <text x="20" y="86" fill="#8fa2d6">Idempotency-Key: ticket-4471</text>
        <text x="20" y="110" fill="#4ade80">200 OK  <tspan fill="#e8eeff">balance: 374.50</tspan></text>
        <text x="20" y="142" fill="#8fa2d6"># la red falla, la terminal reintenta</text>
        <text x="20" y="166" fill="#4ade80">200 OK  <tspan fill="#e8eeff">replayed: true</tspan></text>
      </g>
    </g>
  </g>
</svg>
